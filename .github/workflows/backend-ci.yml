name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/**'
      - 'data/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/**'
      - 'data/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: makemerich_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/api/requirements.txt
        pip install ruff pytest pytest-asyncio httpx
        
    - name: Lint with Ruff
      run: |
        ruff check services/
        
    - name: Run Alembic Migrations
      env:
        DATABASE_URL: postgresql+asyncpg://admin:adminpassword@localhost:5432/makemerich_test
      run: |
        cd data
        PYTHONPATH=../services/api alembic upgrade head
        
    - name: Test with pytest
      env:
        DATABASE_URL: postgresql+asyncpg://admin:adminpassword@localhost:5432/makemerich_test
        REDIS_URL: redis://localhost:6379/0
        ENVIRONMENT: test
      run: |
        cd services/api
        pytest tests/ -v
